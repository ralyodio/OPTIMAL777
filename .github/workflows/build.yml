name: Build ACI Library

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Mathlib
        uses: actions/cache@v4
        with:
          path: .lake
          key: Linux-lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Get Mathlib cache
        run: lake exe cache get

      # Build every lean_lib declared in lakefile.lean plus the executable.
      # A bare `lake build` only builds the default target (AWM21), and diffing
      # HEAD^..HEAD only checked the last commit of a push.
      - name: Build all libraries
        run: |
          set -o pipefail
          TARGETS=$(grep -oP '^lean_lib \K\S+' lakefile.lean)
          lake build $TARGETS aci_bootstrap 2>&1 | tee build.log

      - name: Check for sorry
        run: |
          if grep -n "declaration uses 'sorry'" build.log; then
            echo "::error::Found declarations that use sorry"
            exit 1
          fi
          echo "No sorry found."
